<div class="pagebuilder-content-type pagebuilder-iwocapay-cart-banner" event="{ mouseover: onMouseOver, mouseout: onMouseOut }, mouseoverBubble: false">
    <render args="getOptions().template"></render>
    <div attr="data.main.attributes" ko-style="data.main.style" css="data.main.css" class="iwocapay-banner iwocapay-banner--preview">
        <div class="iwocapay-banner__label">
            <strong>iwocaPay Cart Banner</strong>
        </div>
        <div class="iwocapay-banner__info">
            <span>Shows basket instalment options. Durations, interest &amp; theme come from your iwocaPay Price Banner settings; only appears for eligible basket totals.</span>
        </div>
    </div>
</div>
